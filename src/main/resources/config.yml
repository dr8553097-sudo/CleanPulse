language: "en"

# General Automated Optimization Pulse Settings
pulse:
  auto-pulse:
    enabled: true
    interval-seconds: 300 # Default: 5 minutes (300 seconds)
    emergency-tps-threshold: 16.0 # Emergency pulse if TPS drops below this
  
  announcements:
    chat-broadcast: true
    actionbar-warnings: true
    title-warnings: true
    sound-effects: true

# Next-Gen Game AI & Navigation Optimizer (Beyond Paper limits)
ai-optimizer:
  enabled: true
  scan-interval-ticks: 100 # Scans every 5 seconds
  throttle-stuck-pathfinders: true
  throttle-animal-clusters: true
  prune-villager-memory: true

# Zero-Loss Item Rarity Shield (Never lose valuables)
rarity-shield:
  enabled: true
  immune-materials:
    - NETHERITE_SWORD
    - NETHERITE_PICKAXE
    - NETHERITE_AXE
    - NETHERITE_SHOVEL
    - NETHERITE_HOE
    - NETHERITE_HELMET
    - NETHERITE_CHESTPLATE
    - NETHERITE_LEGGINGS
    - NETHERITE_BOOTS
    - NETHERITE_INGOT
    - NETHERITE_UPGRADE_SMITHING_TEMPLATE
    - DIAMOND_SWORD
    - DIAMOND_PICKAXE
    - DIAMOND_AXE
    - DIAMOND_SHOVEL
    - DIAMOND_HOE
    - DIAMOND_HELMET
    - DIAMOND_CHESTPLATE
    - DIAMOND_LEGGINGS
    - DIAMOND_BOOTS
    - DIAMOND
    - DIAMOND_BLOCK
    - ELYTRA
    - TOTEM_OF_UNDYING
    - SHULKER_BOX
    - WHITE_SHULKER_BOX
    - BLACK_SHULKER_BOX
    - BLUE_SHULKER_BOX
    - RED_SHULKER_BOX
    - GREEN_SHULKER_BOX
    - PURPLE_SHULKER_BOX
    - CYAN_SHULKER_BOX
    - ORANGE_SHULKER_BOX
    - YELLOW_SHULKER_BOX
    - LIME_SHULKER_BOX
    - PINK_SHULKER_BOX
    - GRAY_SHULKER_BOX
    - LIGHT_GRAY_SHULKER_BOX
    - LIGHT_BLUE_SHULKER_BOX
    - MAGENTA_SHULKER_BOX
    - BROWN_SHULKER_BOX
    - ENCHANTED_GOLDEN_APPLE
    - BEACON
    - TRIDENT
    - ENCHANTED_BOOK
  junk-materials:
    - ARROW
    - SPECTRAL_ARROW
    - ROTTEN_FLESH
    - COBBLESTONE
    - DIRT
    - NETHERRACK
    - WHEAT_SEEDS
    - BEETROOT_SEEDS
    - MELON_SEEDS
    - PUMPKIN_SEEDS
    - POISONOUS_POTATO
    - KELP
    - FEATHER
    - BONE
    - STRING
    - STICK

mob-hibernation:
  enabled: true
  scan-interval-seconds: 10
  density-threshold: 12
  wake-radius: 8.0
  protect-named-mobs: true
  protect-tamed-mobs: true
  protect-bosses: true
  protect-villagers: true

item-stacker:
  enabled: true
  merge-radius: 4.0
  display-hologram: true
  hologram-format: "&d✦ &f[x{amount}] &b{name}"

redstone-sentinel:
  enabled: true
  max-frequency-hz: 14
  auto-freeze: true
  particle-cue: true

simulation-scaler:
  enabled: true
  check-interval-seconds: 30
  base-distance: 10
  min-distance: 4
  scale-down-tps: 18.0
  scale-up-tps: 19.8

lag-recovery:
  enabled: true
  buffer-duration-minutes: 10
  max-saved-items: 5000

villager-optimizer:
  enabled: true
  optimize-enclosed: true

hopper-suppressor:
  enabled: true
  sleep-empty-ticks: 40

death-shield:
  enabled: true
  duration-seconds: 300
  hologram-label: "&b🛡 &fDeath Shield &7({time}s)"

mining-filter:
  enabled: true
  default-materials:
    - COBBLESTONE
    - COBBLED_DEEPSLATE
    - NETHERRACK
    - DIRT
    - ANDESITE
    - DIORITE
    - GRANITE
    - TUFF
